specVersion: 0.0.5
description: Swapboard v2 — trustless OTC bulletin board for ERC20 and native ETH swaps
repository: https://github.com/ETHCF/swapboard
schema:
  file: ./schema.graphql
dataSources:
  - kind: ethereum
    name: Swapboard
    network: sepolia
    source:
      # Placeholder: deploy.sh rewrites address and startBlock after deployment.
      address: "0xEA7A84a18F5a7c21b97e83D5D7befaF053836B90"
      abi: Swapboard
      startBlock: 11772941
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      entities:
        - Order
        - Fill
        - OrderModification
        - Token
        - Pair
        - Account
        - GlobalStats
      abis:
        - name: Swapboard
          file: ./abis/Swapboard.json
        - name: ERC20
          file: ./abis/ERC20.json
      eventHandlers:
        - event: OrderCreated(indexed uint256,indexed address,address,uint128,address,uint128,indexed bool)
          handler: handleOrderCreated
        - event: OrderFilled(indexed uint256,indexed address,uint128,uint128)
          handler: handleOrderFilled
        - event: OrderCanceled(indexed uint256)
          handler: handleOrderCanceled
        - event: OrderModified(indexed uint256,indexed address,uint128,uint128)
          handler: handleOrderModified
        - event: OrderPartialFillUpdated(indexed uint256,indexed bool)
          handler: handleOrderPartialFillUpdated
      file: ./src/mapping.ts

specVersion: 1.0.0
indexerHints:
  prune: auto
schema:
  file: ./schema.graphql
dataSources:
  - kind: ethereum
    name: Swapboard
    network: sepolia
    source:
      address: "0x57FbEE5959DA886E6699afaE1113E9Fa20E21762"
      abi: Swapboard
      startBlock: 10240098
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      entities:
        - Order
        - Token
        - GlobalStats
      abis:
        - name: Swapboard
          file: ./abis/Swapboard.json
        - name: ERC20
          file: ./abis/ERC20.json
      eventHandlers:
        - event: OrderCreated(indexed uint256,indexed address,address,uint256,address,uint256)
          handler: handleOrderCreated
        - event: OrderFilled(indexed uint256,indexed address)
          handler: handleOrderFilled
        - event: OrderCanceled(indexed uint256)
          handler: handleOrderCanceled
      file: ./src/mapping.ts

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, v2]

env:
  FOUNDRY_PROFILE: ci

jobs:
  contracts:
    name: Contract Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable
          cache: true

      - name: Check formatting
        run: make fmt-check

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Lint contracts
        run: make lint

      - name: Build contracts
        run: make build-contracts

      - name: Run tests
        run: make test-contracts

      - name: Run coverage
        run: make coverage

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          files: contracts/lcov.info
          flags: contracts

  subgraph:
    name: Subgraph Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 8

      - name: Get pnpm store directory
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Cache pnpm dependencies
        uses: actions/cache@v6
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-subgraph-${{ hashFiles('subgraph/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-subgraph-

      - name: Install dependencies
        working-directory: subgraph
        run: pnpm install

      - name: Generate types
        working-directory: subgraph
        run: pnpm codegen

      - name: Build subgraph
        working-directory: subgraph
        run: pnpm build

      - name: Run tests
        working-directory: subgraph
        run: pnpm test

  frontend:
    name: Frontend Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Install dependencies
        working-directory: frontend
        run: npm install

      - name: Run tests
        working-directory: frontend
        run: npm test

  security:
    name: Security Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable
          cache: true

      - name: Run Slither
        uses: crytic/slither-action@v0.4.0
        with:
          target: contracts/
          slither-args: --filter-paths "lib/|test/|mocks/"
          fail-on: high

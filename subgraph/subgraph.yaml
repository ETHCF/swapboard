specVersion: 1.0.0
indexerHints:
  prune: auto
schema:
  file: ./schema.graphql
dataSources:
  - kind: ethereum
    name: Swapboard
    network: sepolia
    source:
      address: "0xBe3D7A555aa633263110d10d37AB40Ef3a2b8BBa"
      abi: Swapboard
      startBlock: 9990994
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      entities:
        - Order
        - Token
        - GlobalStats
      abis:
        - name: Swapboard
          file: ./abis/Swapboard.json
        - name: ERC20
          file: ./abis/ERC20.json
      eventHandlers:
        - event: OrderCreated(indexed uint256,indexed address,address,uint256,address,uint256)
          handler: handleOrderCreated
        - event: OrderFilled(indexed uint256,indexed address)
          handler: handleOrderFilled
        - event: OrderCanceled(indexed uint256)
          handler: handleOrderCanceled
      file: ./src/mapping.ts

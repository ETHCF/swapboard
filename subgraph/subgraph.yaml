specVersion: 1.0.0
indexerHints:
  prune: auto
schema:
  file: ./schema.graphql
dataSources:
  - kind: ethereum
    name: OTCBoard
    network: mainnet
    source:
      address: "0x0000000000000000000000000000000000000000"
      abi: OTCBoard
      startBlock: 0
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      entities:
        - Order
        - Token
        - GlobalStats
      abis:
        - name: OTCBoard
          file: ./abis/OTCBoard.json
        - name: ERC20
          file: ./abis/ERC20.json
      eventHandlers:
        - event: OrderCreated(indexed uint256,indexed address,address,uint256,address,uint256)
          handler: handleOrderCreated
        - event: OrderFilled(indexed uint256,indexed address)
          handler: handleOrderFilled
        - event: OrderCanceled(indexed uint256)
          handler: handleOrderCanceled
      file: ./src/mapping.ts

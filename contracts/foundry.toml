[profile.default]
src = "src"
out = "out"
libs = ["lib"]
dotenv = "../.env"
solc = "0.8.36"
optimizer = true
optimizer_runs = 10000
via_ir = false
evm_version = "cancun"
no_match_coverage = "test/"

[profile.default.fuzz]
runs = 256
max_test_rejects = 65536

[profile.default.invariant]
runs = 256
depth = 500
fail_on_revert = false
shrink_run_limit = 5000

[profile.ci]
fuzz = { runs = 256 }
invariant = { runs = 64, depth = 128 }

[fmt]
# 119 so forge fmt wraps before solhint's max-line-length (120); forge can leave +1.
line_length = 119
tab_width = 4
bracket_spacing = false
int_types = "long"
multiline_func_header = "params_first"
quote_style = "double"
number_underscore = "thousands"

[lint]
exclude_lints = ["block-timestamp"]

[rpc_endpoints]
mainnet = "${MAINNET_RPC_URL}"
sepolia = "${SEPOLIA_RPC_URL}"

[etherscan]
mainnet = { key = "${ETHERSCAN_API_KEY}" }
sepolia = { key = "${ETHERSCAN_API_KEY}" }

name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Build dist
        run: |
          mkdir -p dist
          for f in index.html app.js lib.js style.css mock.js API.html manifest.json sw.js; do
            cp "frontend/$f" "dist/$f"
          done

          COMMIT_HASH="${GITHUB_SHA:0:7}"
          COMMIT_FULL="${GITHUB_SHA}"
          BUILD_TIME=$(date -u +"%Y-%m-%dT%H:%M:%SZ")

          HASH_APPJS=$(sha256sum dist/app.js | cut -d' ' -f1)
          HASH_CSS=$(sha256sum dist/style.css | cut -d' ' -f1)
          HASH_HTML=$(sha256sum dist/index.html | cut -d' ' -f1)
          HASH_MOCK=$(sha256sum dist/mock.js | cut -d' ' -f1)

          sed -i "s/__COMMIT_HASH__/${COMMIT_HASH}/g" dist/index.html
          sed -i "s/__COMMIT_FULL__/${COMMIT_FULL}/g" dist/index.html
          sed -i "s/__BUILD_TIME__/${BUILD_TIME}/g" dist/index.html
          sed -i "s/__HASH_APPJS__/${HASH_APPJS}/g" dist/index.html
          sed -i "s/__HASH_CSS__/${HASH_CSS}/g" dist/index.html
          sed -i "s/__HASH_HTML__/${HASH_HTML}/g" dist/index.html
          sed -i "s/__HASH_MOCK__/${HASH_MOCK}/g" dist/index.html

          echo "Build info:"
          echo "  Commit: ${COMMIT_HASH}"
          echo "  Time: ${BUILD_TIME}"
          echo "  app.js: ${HASH_APPJS:0:16}..."
          echo "  style.css: ${HASH_CSS:0:16}..."

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
